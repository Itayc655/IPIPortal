<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>מחירוני חניונים</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #f0f4f8;
      color: #1a202c;
      direction: rtl;
    }

    header {
      background: linear-gradient(135deg, #1e3a5f 0%, #2d6a9f 100%);
      color: white;
      padding: 28px 24px 20px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }

    header h1 { font-size: 1.9rem; font-weight: 700; letter-spacing: 0.5px; }

    #file-date {
      font-size: 0.9rem;
      opacity: 0.8;
      margin-top: 6px;
      min-height: 1.2em;
    }

    .search-bar {
      max-width: 520px;
      margin: 18px auto 0;
    }

    .search-bar input {
      width: 100%;
      padding: 11px 16px;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      direction: rtl;
      outline: none;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    }


    /* Summary */
    .summary {
      text-align: center;
      color: #555;
      font-size: 0.85rem;
      margin: 12px 0 4px;
    }

    /* Grid & cards */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 18px;
      padding: 20px 28px 40px;
      max-width: 1400px;
      margin: 0 auto;
    }

    .card {
      background: white;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      overflow: hidden;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .card:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 20px rgba(0,0,0,0.13);
    }

    .card-header {
      background: linear-gradient(135deg, #1e3a5f, #2d6a9f);
      color: white;
      padding: 14px 16px;
    }

    .card-header h2 { font-size: 1.05rem; font-weight: 700; line-height: 1.3; }

    .card-body { padding: 14px 16px; }

    .detail-row {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 8px;
      font-size: 0.88rem;
      line-height: 1.5;
    }

    .detail-row:last-child { margin-bottom: 0; }

    .icon {
      flex-shrink: 0;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.7rem;
      margin-top: 1px;
    }

    .icon-grace  { background: #e8f4fd; color: #1a6fa8; }
    .icon-tariff { background: #e6f4ea; color: #2d7a3a; }
    .icon-badge  { background: #fff3e0; color: #b45309; }
    .icon-app    { background: #f0f0f0; color: #555; }

    .detail-text { flex: 1; color: #333; white-space: pre-line; }

    .tag {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 0.78rem;
      font-weight: 600;
      margin-top: 2px;
    }

    .tag-app { background: #e8eaf6; color: #3949ab; }

    .hidden { display: none; }

    #no-results {
      text-align: center;
      color: #888;
      font-size: 1rem;
      padding: 60px 20px;
      display: none;
      grid-column: 1 / -1;
    }
  </style>
</head>

// ── Rendering ─────────────────────────────────────────────────────────────────
function classify(text) {
  const t = text.trim().toLowerCase();
  if (t.startsWith('זמן חסד')) return 'grace';
  if (t.startsWith('תעריף') || t.startsWith('מחירון') || t.startsWith('שישי') ||
      t.startsWith('משישי') || t.startsWith('מקסימום') || t.includes('₪')) return 'tariff';
  if (t.includes('ticketless') || t.includes('סלופארק') || t.includes('פנגו')) return 'app';
  return 'badge';
}

function iconFor(cls) {
  if (cls === 'grace')  return { cls: 'icon-grace',  sym: '⏱' };
  if (cls === 'tariff') return { cls: 'icon-tariff', sym: '₪' };
  if (cls === 'app')    return { cls: 'icon-app',    sym: '📱' };
  return                       { cls: 'icon-badge',  sym: 'ℹ' };
}

function buildCard(lot) {
  const rows = lot.details.map(d => {
    const cls = classify(d);
    const ic  = iconFor(cls);
    const textEl = cls === 'app'
      ? `<span class="tag tag-app">${d}</span>`
      : `<span class="detail-text">${d}</span>`;
    return `<div class="detail-row"><div class="icon ${ic.cls}">${ic.sym}</div>${textEl}</div>`;
  }).join('');

  return `<div class="card" data-name="${lot.name.replace(/"/g,'&quot;')}">
    <div class="card-header"><h2>${lot.name}</h2></div>
    <div class="card-body">${rows}</div>
  </div>`;
}

const grid      = document.getElementById('grid');
const noResults = document.getElementById('no-results');
const summary   = document.getElementById('summary');

function renderLots(lots) {
  // remove all cards
  grid.querySelectorAll('.card').forEach(c => c.remove());
  document.getElementById('search').value = '';

  const sorted = [...lots].sort((a, b) => a.name.localeCompare(b.name, 'he'));
  for (const lot of sorted) {
    const tmp = document.createElement('div');
    tmp.innerHTML = buildCard(lot);
    grid.insertBefore(tmp.firstElementChild, noResults);
  }
  summary.textContent = `סה"כ ${sorted.length} חניונים`;
  noResults.style.display = 'none';
}

// Initial render with built-in data
renderLots(builtInLots);

// ── Search ────────────────────────────────────────────────────────────────────
function filterCards() {
  const q = document.getElementById('search').value.trim().toLowerCase();
  let visible = 0;
  const total = grid.querySelectorAll('.card').length;
  grid.querySelectorAll('.card').forEach(card => {
    const match = !q || card.dataset.name.toLowerCase().includes(q);
    card.classList.toggle('hidden', !match);
    if (match) visible++;
  });
  summary.textContent = q ? `מציג ${visible} מתוך ${total} חניונים` : `סה"כ ${total} חניונים`;
  noResults.style.display = visible === 0 ? 'block' : 'none';
}
